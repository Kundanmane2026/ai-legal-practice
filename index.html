<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A free 28-day course teaching Indian advocates and law students to use AI assistants safely in legal practice. Available in English, Hindi and Marathi.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AI in Legal Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Serif+Devanagari:wght@400;600&display=swap">
<style>
/* Layout: a ruled brief — red margin rule, numbered paragraphs in the margin, cause-list style headings */
:root{
  --paper:#F2F4ED; --card:#FBFCF8; --ink:#1A1F1C; --muted:#57604F; --rule:#CBD2C4;
  --accent:#2B3D8F; --accent-soft:#E3E7F5; --seal:#A12C24; --seal-soft:#F6E4E1; --ok:#2F6B3A;
  --display:"Archivo","Noto Sans Devanagari",'Arial Narrow',Arial,sans-serif;
  --body:"Literata","Noto Serif Devanagari",Georgia,'Times New Roman',serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121513; --card:#1A1E1B; --ink:#E5E9E1; --muted:#9BA494; --rule:#2F3630;
  --accent:#93A5F2; --accent-soft:#20263D; --seal:#E58075; --seal-soft:#2E1C1A; --ok:#7FC48B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121513; --card:#1A1E1B; --ink:#E5E9E1; --muted:#9BA494; --rule:#2F3630;
  --accent:#93A5F2; --accent-soft:#20263D; --seal:#E58075; --seal-soft:#2E1C1A; --ok:#7FC48B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 17px/1.65 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 64px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-stretch:80%;line-height:1.08;text-wrap:balance;margin:0}
.eyebrow{font:600 12px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}

/* top bar */
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.brand{font:700 15px/1.2 var(--display);letter-spacing:.02em;color:var(--ink);text-decoration:none}
.brand span{color:var(--seal)}
.bar nav{display:flex;gap:16px;font:500 14px var(--display)}
.bar nav a{text-decoration:none;color:var(--muted)}
.bar nav a:hover{color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;padding-block:48px 40px;align-items:end}
.hero h1{font-size:clamp(44px,7.4vw,92px);font-weight:800;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--seal)}
.hero p.lede{font-size:19px;max-width:34em;margin:20px 0 0}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{font:600 15px/1 var(--display);letter-spacing:.02em;padding:14px 20px;border-radius:3px;border:1.5px solid var(--ink);color:var(--ink);background:transparent;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:hover{border-color:var(--accent)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.stamp{border:2px solid var(--seal);outline:1px solid var(--seal);outline-offset:4px;color:var(--seal);padding:20px 22px;width:100%;max-width:320px;justify-self:end;background:var(--card)}
.stamp .big{font:800 54px/1 var(--display);font-stretch:75%}
.stamp dl{display:grid;grid-template-columns:2.2em minmax(0,1fr);align-items:baseline;gap:8px 12px;margin:14px 0 0;font:500 15px/1.35 var(--display);color:var(--ink)}
.stamp dt{color:var(--seal);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.stamp dd{margin:0}

/* sections */
section{padding-block:40px;border-top:1px solid var(--rule)}
.sec-head{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;margin-bottom:24px}
.sec-head h2{font-size:clamp(28px,4vw,40px);font-weight:750}
.diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border-top:2px solid var(--ink)}
.diff div{padding:18px 18px 20px 0;border-bottom:1px solid var(--rule)}
.diff h3{font-size:20px;font-weight:700;margin-bottom:6px}
.diff p{margin:0;color:var(--muted);font-size:15.5px}

/* curriculum */
.weeks{display:grid;gap:28px}
.week{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px}
.week h3{font-size:24px;font-weight:750}
.week .eyebrow{margin-bottom:6px}
.week p.wdesc{color:var(--muted);font-size:15px;margin:8px 0 0}
.days{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.days li{border-bottom:1px solid var(--rule)}
.days a,.days .locked{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:12px 0;text-decoration:none;color:var(--ink)}
.days a:hover .t{color:var(--accent)}
.days .n{font:600 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.days .t{font-size:16.5px}
.tag{font:600 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:2px;white-space:nowrap}
.tag.open{background:var(--accent-soft);color:var(--accent)}
.tag.done{background:var(--accent);color:var(--paper)}
.tag.soon{color:var(--muted);border:1px solid var(--rule)}
.days .locked .t{color:var(--muted)}

/* instructor */
.instr{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px}
.instr p{max-width:40em;margin:0 0 12px}
.creds{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px;font-size:15.5px}
.creds li{padding-left:18px;position:relative}
.creds li::before{content:"§";position:absolute;left:0;color:var(--seal);font-family:var(--display);font-weight:700}

.fine{font-size:13.5px;color:var(--muted);max-width:62em}
.fine p{margin:0 0 8px}

/* lesson view */
.lesson{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding-top:32px}
.lesson aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;font:500 14px/1.4 var(--display)}
.lesson aside ol{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:2px}
.lesson aside a{display:block;padding:5px 0;text-decoration:none;color:var(--muted)}
.lesson aside a[aria-current="page"]{color:var(--ink);font-weight:700}
.lesson aside a .ck{color:var(--ok)}
.sheet{min-width:0;border-left:2px solid var(--seal);padding-left:28px;max-width:720px}
.sheet h1{font-size:clamp(34px,5.4vw,56px);font-weight:800;margin:8px 0 6px}
.sheet .meta{font:500 14px var(--display);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.para{position:relative;margin:22px 0}
.para::before{content:attr(data-n);position:absolute;left:-58px;top:2px;width:22px;text-align:right;font:500 12px var(--mono);color:var(--seal);font-variant-numeric:tabular-nums}
.para h2{font-size:22px;font-weight:700;margin:0 0 8px}
.para p{margin:0 0 10px}
.para ul,.para ol{margin:0 0 10px;padding-left:22px}
.para li{margin-bottom:4px}
.prompt{background:var(--card);border:1px solid var(--rule);border-radius:3px;margin:8px 0 4px}
.prompt header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule);font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.prompt pre{margin:0;padding:14px;overflow-x:auto;font:400 13.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.copy{font:600 12px var(--display);letter-spacing:.06em;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:5px 9px;cursor:pointer}
.verify{background:var(--seal-soft);border-left:4px solid var(--seal);padding:14px 16px;margin:8px 0}
.verify h2{color:var(--seal)}
.task{background:var(--accent-soft);border-left:4px solid var(--accent);padding:14px 16px;margin:8px 0}
.tbl{overflow-x:auto;margin:6px 0 10px}
.tbl table{border-collapse:collapse;font-size:15px;min-width:0;width:100%}
.tbl table:has(th:nth-child(3)){min-width:460px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl th{font:600 13px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--ink)}
.cite{font-style:italic}
.lnav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:36px;padding-top:20px;border-top:1px solid var(--rule)}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.soonbox{padding:20px;border:1px dashed var(--rule);margin-top:20px}

footer{border-top:1px solid var(--rule);margin-top:40px;padding-top:20px}

/* daily playbook */
.entry{margin:28px 0 0;padding:18px;border:1.5px solid var(--ink);background:var(--card)}
.entry h2{font-size:22px;font-weight:700;margin:0 0 4px}
.entry p{margin:0 0 10px;color:var(--muted);font-size:15px}
.entry label{display:block;font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;margin:12px 0 6px}
.entry textarea{width:100%;min-height:110px;font:400 15px/1.5 var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:10px;resize:vertical}
.entry .saved{font:500 13px var(--display);color:var(--ok);min-height:1.2em;margin-top:6px}
.pb{padding-top:32px;max-width:760px}
.pb h1{font-size:clamp(34px,5.4vw,56px);font-weight:800;margin:8px 0 10px}
.meter{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;margin:14px 0 6px}
.meter span{display:block;height:100%;background:var(--accent)}
.pbday{border-top:1px solid var(--rule);padding:16px 0}
.pbday h2{font-size:20px;font-weight:700;margin:0 0 6px}
.pbday dl{margin:0;display:grid;gap:6px}
.pbday dt{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pbday dd{margin:0 0 6px;white-space:pre-wrap}
.pbday .empty{color:var(--muted);font-style:italic}
#pb-text{position:absolute;left:-9999px;width:1px;height:1px}

@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr);padding-block:32px;gap:28px}
  .stamp{justify-self:stretch;max-width:none;margin-inline:5px}
  .sec-head,.week,.instr,.lesson{grid-template-columns:minmax(0,1fr);gap:12px}
  .lesson aside{position:static}
  .lesson aside ol{display:flex;flex-wrap:wrap;gap:4px 12px}
  .sheet{padding-left:18px}
  .para::before{position:static;display:block;text-align:left;width:auto;margin-bottom:2px}
  .days a,.days .locked{grid-template-columns:52px minmax(0,1fr);}
  .days .tag{grid-column:2;justify-self:start}
}

/* language switcher */
.bar-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.langmenu{position:relative}
.langmenu summary{list-style:none;cursor:pointer;font:600 13px/1 var(--display);padding:8px 10px;border:1px solid var(--rule);border-radius:3px;color:var(--ink);display:flex;gap:6px;align-items:center;white-space:nowrap}
.langmenu summary::-webkit-details-marker{display:none}
.langmenu[open] summary{border-color:var(--ink)}
.lm-ic{font-weight:700;color:var(--seal)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lm-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:min(340px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--card);border:1.5px solid var(--ink);padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.lm-cur{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lm-btn{font:600 15px var(--display);padding:7px 12px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:2px;cursor:pointer}
.lm-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lm-note{font-size:13px;color:var(--muted);margin:6px 0 8px;line-height:1.45}
.lm-mt{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.lm-mt a{display:flex;justify-content:space-between;gap:6px;padding:6px 2px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--rule);font-size:15px}
.lm-mt a span{font:500 11px var(--display);color:var(--muted);align-self:center}
.lm-mt a:hover{color:var(--accent)}
.trnote{margin-top:16px;padding:10px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);font-size:14.5px}
.pnote{font-size:14.5px;color:var(--muted);margin:0 0 6px}
:lang(hi) h1,:lang(mr) h1,:lang(hi) h2,:lang(mr) h2,:lang(hi) h3,:lang(mr) h3{line-height:1.3;font-stretch:100%}
:lang(hi) body,:lang(mr) body{line-height:1.8}
:lang(hi) .hero h1,:lang(mr) .hero h1{font-size:clamp(38px,6.2vw,76px)}
:lang(hi) .eyebrow,:lang(mr) .eyebrow{letter-spacing:.04em}
@media (max-width:760px){.lm-pop{right:auto;left:0}}
</style>
</head>

 ["table","What to replace",`<div class="tbl"><table><thead><tr><th>In the document</th><th>Replace with</th></tr></thead><tbody>
<tr><td>Ramesh Patil, Flat 4, Kothrud, Pune</td><td>[CLIENT], [CLIENT ADDRESS]</td></tr>
<tr><td>Aadhaar / PAN / bank account no.</td><td>Delete entirely</td></tr>
<tr><td>Civil Suit No. 1234 of 2025, Pune</td><td>[SUIT NO.], [COURT]</td></tr>
<tr><td>₹ 18,40,000 due on 12.03.2026</td><td>Keep if needed for the analysis</td></tr>
</tbody></table></div>`],
 ["prompt","Try it",`Here is a paragraph from a legal notice. Replace every name, address, identity number and case number with a labelled placeholder in square brackets, and list the placeholders you used at the end. Do not change anything else.

[paste a paragraph you have already anonymised by hand, or a made-up one]`],
 ["task","Practice task",`<p>Write a one-page "AI confidentiality note" for your own practice: what you will never paste, what you anonymise, and which settings you use. You will reuse it in Week 4.</p>`],
 ["verify","Verify before you rely",`<p>Never send real client data to a tool to test whether it anonymises well. Test with invented facts first.</p>`]
]},
3:{min:15,sections:[
 ["p","The FIJO method",`<p>Most weak legal prompts are missing one of four things. Before you send a prompt, check that it has all four:</p>
<div class="tbl"><table><thead><tr><th>Letter</th><th>Means</th><th>Example</th></tr></thead><tbody>
<tr><td><strong>F</strong></td><td>Facts</td><td>Tenant has not paid rent for 7 months; lease expired in March 2026.</td></tr>
<tr><td><strong>I</strong></td><td>Issue</td><td>Can the landlord seek eviction and arrears together?</td></tr>
<tr><td><strong>J</strong></td><td>Jurisdiction</td><td>Maharashtra; Maharashtra Rent Control Act, 1999.</td></tr>
<tr><td><strong>O</strong></td><td>Output</td><td>One-page note to a senior, with headings and open questions.</td></tr>
</tbody></table></div>`],
 ["p","Before and after",`<p><strong>Weak:</strong> "Tell me about eviction law."</p><p><strong>Strong:</strong> the FIJO prompt below. It tells the assistant who is asking, what happened, where, and what the finished work should look like.</p>`],
 ["prompt","Try it",`Act as a research assistant to an advocate in Pune.
FACTS: [CLIENT] is a landlord. The tenant has not paid rent for 7 months. The written lease expired in March 2026 and was not renewed.
ISSUE: Can [CLIENT] seek eviction and recovery of arrears, and what notice should be served first?
JURISDICTION: Maharashtra. Consider the Maharashtra Rent Control Act, 1999 and the Transfer of Property Act, 1882.
OUTPUT: A one-page note with headings: Applicable law, Steps in order, Documents needed, Open questions for the client. Mark any statement you are unsure of with [CHECK]. Do not cite case law.`],
 ["task","Practice task",`<p>Take a real (anonymised) query from your week. Write it once as a one-line prompt and once in FIJO form. Compare the two answers side by side.</p>`],
 ["verify","Verify before you rely",`<p>The [CHECK] markers are a starting point, not a guarantee. Unmarked statements can still be wrong; check the sections against the bare Act.</p>`]
]},
4:{min:15,sections:[
 ["p","Context changes the answer",`<p>The assistant knows only what is in the conversation. Three kinds of context make the biggest difference:</p><ul><li><strong>Documents:</strong> paste or attach the agreement, notice or order you want it to work from, anonymised.</li><li><strong>Role:</strong> who you are and who the output is for (a senior advocate, a client, a court).</li><li><strong>Audience:</strong> a first-generation business owner needs different words from an in-house counsel.</li></ul>`],
 ["p","Tell it what to work from",`<p>When you supply a document, instruct the assistant to rely only on it. Ask it to quote the clause number for every point it makes, so you can check each one quickly.</p>`],
 ["prompt","Try it",`I am attaching an anonymised commercial lease. Work only from this document. Do not add terms that are not in it.
1. List the tenant's payment obligations, with the clause number for each.
2. List every clause that allows either party to terminate, with the notice period.
3. Note anything that is unclear or contradictory.
Audience: my client, a small-business owner with no legal training. Use plain English.`],
 ["task","Practice task",`<p>Run the same request twice: once for "a senior advocate" and once for "a client with no legal training". Note what changed in vocabulary, length and structure.</p>`],
 ["verify","Verify before you rely",`<p>Open the document and check every clause number it gave you. A wrong clause number is the most common error at this stage.</p>`]
]},
5:{min:15,sections:[
 ["p","Ask for the shape you need",`<p>If you do not ask for a structure, you get an essay. Lawyers work in fixed structures already, so name them:</p><ul><li><strong>IRAC</strong> (Issue, Rule, Application, Conclusion) for analysis.</li><li><strong>Tables</strong> for comparisons, chronologies and clause lists.</li><li><strong>Numbered paragraphs</strong> for pleadings and notices.</li><li><strong>Headings you choose</strong> for memos.</li></ul>`],
 ["p","Constraints that save editing time",`<p>Set the length ("under 300 words"), the register ("formal, for filing"), the language ("Indian English spelling"), and what to leave out ("no case law", "no recommendations").</p>`],
 ["prompt","Try it",`Using the facts below, prepare a chronology as a table with columns: Date | Event | Document | Relevance to limitation.
Sort by date. Use DD.MM.YYYY. If a date is uncertain, write "approx." and explain in a note under the table.
Then, in one IRAC block, analyse whether the claim is within limitation under the Limitation Act, 1963. Mark any article number with [CHECK].

FACTS: [paste anonymised facts with dates]`],
 ["task","Practice task",`<p>Build a chronology for one of your files. Compare the time it took against doing it by hand, and count how many dates you had to correct.</p>`],
 ["verify","Verify before you rely",`<p>Recalculate every limitation date yourself. Never file on an AI-computed limitation period without checking the article and the dates.</p>`]
]},
6:{min:15,sections:[
 ["p","The first answer is a draft",`<p>Good results come from a short back-and-forth. Point to exactly what is wrong instead of starting again: "Paragraph 3 is too long; split it", "Remove the recommendation", "Use the defined term [LESSOR] throughout".</p>`],
 ["p","Use it as your opponent",`<p>One of the most valuable uses is asking the assistant to attack your own position. It will find gaps in reasoning, missing evidence and weak points in drafting before the other side does.</p>`],
 ["prompt","Try it",`Below is my draft argument. Act as opposing counsel.
1. List the three strongest objections you would raise, strongest first.
2. For each, say what evidence or authority I would need to answer it.
3. Point out any sentence in my draft that overstates the position.
Do not rewrite my draft.

DRAFT: [paste anonymised draft]`],
 ["task","Practice task",`<p>Run the "opposing counsel" prompt on a draft you wrote this month. Note one objection you had not thought of, and revise your draft yourself.</p>`],
 ["verify","Verify before you rely",`<p>Counter-arguments may cite law that does not exist. Use them as questions to research, not as authority.</p>`]
]},
7:{min:20,sections:[
 ["p","The verification checklist",`<div class="tbl"><table><thead><tr><th>Check</th><th>Where</th></tr></thead><tbody>
<tr><td>Every judgment exists and says what is claimed</td><td>SCC Online, Manupatra, Indian Kanoon, court websites</td></tr>
<tr><td>Citation, bench and paragraph numbers</td><td>The reported judgment itself</td></tr>
<tr><td>Section numbers under the current law (BNS, BNSS, BSA since 1 July 2024)</td><td>India Code; official comparison tables</td></tr>
<tr><td>Amendments and notifications</td><td>Gazette of India; India Code</td></tr>
<tr><td>Dates, amounts and limitation</td><td>Your file; your own calculation</td></tr>
<tr><td>Facts match the client's instructions</td><td>Client documents</td></tr>
</tbody></table></div>`],
 ["p","Ask it to show its uncertainty",`<p>You cannot make an assistant accurate by asking, but you can make its weak points easier to find. Ask it to mark uncertain statements, separate what came from your documents from what came from general knowledge, and list what you should verify.</p>`],
 ["prompt","Try it",`Review the answer you just gave me. Produce a table with columns: Statement | Source (my document / general knowledge) | Confidence (high, medium, low) | How I should verify it.
Include every case name, section number, date and amount you mentioned.`],
 ["task","Week 1 project",`<p>Take one small, real (anonymised) task from your practice. Use FIJO, give context, ask for a structure, run the opposing-counsel check, then run the verification table. Keep a one-page record of what the AI got right, what you corrected, and how long it took. This is the first entry in the playbook you will finish on Day 28.</p>`],
 ["verify","Verify before you rely",`<p>The final work product is yours. Sign, file or send nothing you have not checked against primary sources.</p>`]
]}
};

/* ---------- WEEK 2: Research and drafting ---------- */

8:{min:15,sections:[
 ["p","Why AI summaries go wrong",`<p>An AI summary tends to flatten a judgment. It mixes the ratio with obiter, with counsel's arguments and with the facts, and presents all of it in the same confident voice. Headnotes have the same weakness: they are editorial notes, not part of the judgment.</p>`],
 ["p","Ratio, obiter and what binds",`<p>Under Article 141 of the Constitution, the law declared by the Supreme Court binds all courts in India. What binds is the ratio: the principle necessary to decide the issue. In <span class="cite">State of Orissa v. Sudhansu Sekhar Misra</span>, AIR 1968 SC 647, the Court held that a decision is an authority only for what it actually decides. Ask the assistant to separate the two and to point to paragraph numbers, so you can check each one.</p>`],
 ["prompt","Try it",`I am attaching the full text of a judgment. Work only from this text.
Summarise it under these headings:
1. Court, bench strength, date
2. Facts (under 150 words)
3. Issues framed
4. Holding on each issue, with paragraph numbers
5. Ratio decidendi, quoting the key paragraph numbers
6. Obiter observations, with paragraph numbers
7. Statutes and sections discussed
8. Cases relied on, followed or distinguished
9. Relevance to my issue: [describe your issue in one line]
If something is not in the text, write "not stated". Do not add cases that are not cited in the judgment.`],
 ["task","Practice task",`<p>Choose a judgment you already know well. Run the prompt and compare the ratio it gives with your own reading. Note one place where it confused ratio with obiter or with counsel's argument.</p>`],
 ["verify","Verify before you rely",`<p>Check bench strength (a larger bench binds a smaller one), every paragraph number, and the judgment's later history. Use a citator such as SCC Online or Manupatra to see whether it has been overruled, doubted or distinguished.</p>`]
]},
9:{min:15,sections:[
 ["p","Three new codes",`<p>Since 1 July 2024, the Bharatiya Nyaya Sanhita (BNS), the Bharatiya Nagarik Suraksha Sanhita (BNSS) and the Bharatiya Sakshya Adhiniyam (BSA) have replaced the IPC, the CrPC and the Indian Evidence Act. Offences committed before that date are still governed by the IPC (Article 20(1) of the Constitution), and the BNSS saves proceedings that were pending when it came into force. You will work with both numbering systems for years.</p>`],
 ["table","Common conversions",`<div class="tbl"><table><thead><tr><th>Subject</th><th>Old</th><th>New</th></tr></thead><tbody>
<tr><td>Murder</td><td>IPC 302</td><td>BNS 103</td></tr>
<tr><td>Cheating and dishonestly inducing delivery</td><td>IPC 420</td><td>BNS 318(4)</td></tr>
<tr><td>Criminal breach of trust</td><td>IPC 406</td><td>BNS 316</td></tr>
<tr><td>Defamation</td><td>IPC 499 / 500</td><td>BNS 356</td></tr>
<tr><td>Common intention</td><td>IPC 34</td><td>BNS 3(5)</td></tr>
<tr><td>Anticipatory bail</td><td>CrPC 438</td><td>BNSS 482</td></tr>
<tr><td>Inherent powers of the High Court</td><td>CrPC 482</td><td>BNSS 528</td></tr>
<tr><td>Maintenance</td><td>CrPC 125</td><td>BNSS 144</td></tr>
<tr><td>Certificate for electronic records</td><td>IEA 65B</td><td>BSA 63</td></tr>
<tr><td>Professional communications</td><td>IEA 126</td><td>BSA 132</td></tr>
</tbody></table></div><p>Confirm every entry against the official comparison tables before use.</p>`],
 ["p","Where AI gets this wrong",`<p>Assistants mix old and new numbers, miss renumbered sub-sections, and sometimes invent sections. The fix is to paste the bare text of the section from India Code and ask the assistant to work only from that text.</p>`],
 ["prompt","Try it",`I am pasting the text of Section [X] of the Bharatiya Nyaya Sanhita, 2023, copied from India Code.
1. List the ingredients of the offence the prosecution must prove.
2. State the corresponding IPC section, and mark it [CHECK].
3. If I also paste the old IPC text, list every difference in wording, punishment and scope.
4. List three questions a defence lawyer would ask about these ingredients.
Work only from the text I paste. If I have not pasted something you need, ask for it.

BNS TEXT: [paste]
IPC TEXT (optional): [paste]`],
 ["task","Practice task",`<p>Pick the five sections you use most often. Build a one-page conversion card (old section, new section, any change in wording) and check every line against India Code.</p>`],
 ["verify","Verify before you rely",`<p>Use India Code and the official comparison tables for numbering. For an offence, check its date: it decides whether the IPC or the BNS applies.</p>`]
]},
10:{min:15,sections:[
 ["p","The assistant drafts; you research",`<p>Let the assistant structure and draft the memo from authorities you have already found and read. Do not let it supply the authorities. This one rule removes most citation errors.</p>`],
 ["table","A memo structure that works",`<div class="tbl"><table><thead><tr><th>Heading</th><th>What goes in it</th></tr></thead><tbody>
<tr><td>Question presented</td><td>One sentence, with jurisdiction</td></tr>
<tr><td>Short answer</td><td>Yes / no / probably, in three lines</td></tr>
<tr><td>Facts</td><td>Only the facts the answer depends on</td></tr>
<tr><td>Applicable law</td><td>Statutes and authorities you verified</td></tr>
<tr><td>Analysis</td><td>Law applied to facts, issue by issue</td></tr>
<tr><td>Counter-arguments</td><td>The other side's best points and your answer</td></tr>
<tr><td>Conclusion and next steps</td><td>What to do, by whom, by when</td></tr>
<tr><td>Sources verified</td><td>Each authority, where checked, date checked</td></tr>
</tbody></table></div>`],
 ["prompt","Try it",`Draft a research memo for a senior advocate using the structure below.
QUESTION: [one sentence]
FACTS: [anonymised facts]
AUTHORITIES I HAVE VERIFIED (use only these; do not add others):
- [Statute, section] – [one-line note on what it says]
- [Case name, citation, para no.] – [one-line note on the holding]
STRUCTURE: Question presented; Short answer; Facts; Applicable law; Analysis; Counter-arguments; Conclusion and next steps.
If the authorities I gave do not support a point, say "authority needed" instead of filling the gap.`],
 ["task","Practice task",`<p>Write the memo for a question from your current work. Count how many "authority needed" flags it raised; each one is a research task for you.</p>`],
 ["verify","Verify before you rely",`<p>Add a "Sources verified" list at the end in your own hand. Any authority in the memo that is not on that list must come out.</p>`]
]},
11:{min:15,sections:[
 ["table","What every legal notice needs",`<div class="tbl"><table><thead><tr><th>Element</th><th>Check</th></tr></thead><tbody>
<tr><td>Sender and recipient</td><td>Correct legal names and addresses</td></tr>
<tr><td>Facts</td><td>Numbered paragraphs, dated, matching documents</td></tr>
<tr><td>Legal basis</td><td>Statute or contract clause relied on</td></tr>
<tr><td>Demand</td><td>Exact amount or act required</td></tr>
<tr><td>Time limit</td><td>Statutory where one applies</td></tr>
<tr><td>Consequence</td><td>Proceedings that will follow</td></tr>
<tr><td>Service</td><td>Registered post AD or speed post; keep proof</td></tr>
</tbody></table></div>`],
 ["table","Example: a dishonoured cheque",`<p>Section 138 of the Negotiable Instruments Act, 1881 sets strict timelines:</p><div class="tbl"><table><thead><tr><th>Step</th><th>Time limit</th></tr></thead><tbody>
<tr><td>Send demand notice</td><td>Within 30 days of receiving the bank's information that the cheque was returned unpaid</td></tr>
<tr><td>Drawer pays</td><td>Within 15 days of receiving the notice</td></tr>
<tr><td>File complaint</td><td>Within one month after the 15-day period ends (Section 142(1)(b))</td></tr>
</tbody></table></div><p>Other notices have their own rules. A suit against the Government, for example, needs two months' notice under Section 80 of the Code of Civil Procedure.</p>`],
 ["prompt","Try it",`Draft a legal notice under Section 138 of the Negotiable Instruments Act, 1881.
FACTS:
- Drawer: [OPPONENT], [ADDRESS]
- Payee (my client): [CLIENT]
- Cheque no. [__], dated [__], for Rs. [__], drawn on [BANK]
- Purpose: [legally enforceable debt, e.g. repayment of loan given on __]
- Returned unpaid on [__] with reason "[bank memo reason]"
- Bank's return memo received by my client on [__]
OUTPUT: Formal notice in numbered paragraphs, demanding payment within 15 days of receipt, stating that a complaint will follow if unpaid. Use [CHECK] for any date calculation. Do not add facts I have not given.`],
 ["task","Practice task",`<p>Draft a notice for an invented cheque dishonour. Calculate every deadline yourself on a calendar and compare with the assistant's dates.</p>`],
 ["verify","Verify before you rely",`<p>Check the cheque number, amount, dates and the bank's reason against the documents. A wrong date or amount in a Section 138 notice can defeat the complaint.</p>`]
]},
12:{min:15,sections:[
 ["p","A reply is evidence",`<p>A reply to a notice is often produced later in court. Anything admitted there can be used against your client, and anything inconsistent with the later pleading will be put to them in cross-examination. Draft it the way you would draft a written statement.</p>`],
 ["p","Principles",`<ul><li>Reply paragraph by paragraph.</li><li>Deny what is not admitted, specifically. A vague general denial is weak.</li><li>Admit only what is true and harmless.</li><li>Use "without prejudice" only for genuine settlement offers.</li><li>Reserve all rights and remedies.</li></ul>`],
 ["prompt","Try it",`I am attaching a legal notice received by my client and my client's written instructions. Both are anonymised.
STEP 1: Prepare a table: Para no. | Allegation | Client's position (from my instructions only) | Proposed response (admit / deny / not within knowledge) | Supporting document.
STEP 2: List every allegation that my instructions do not cover. Do not guess the client's position on these.
STEP 3: Only after the table, draft a para-wise reply in formal language, denying all allegations not specifically admitted and reserving my client's rights.`],
 ["task","Practice task",`<p>Use the Day 11 notice you drafted. Now reply to it as the drawer's advocate. Notice which weaknesses in your own notice the reply exposes.</p>`],
 ["verify","Verify before you rely",`<p>Every factual statement in the reply must match the client's written instructions. Get the client to confirm the final draft in writing before it is sent.</p>`]
]},
13:{min:15,sections:[
 ["p","What a client needs to know",`<p>A client letter answers five questions: what happened, what it means for them, what the options are, roughly what each costs in time and money, and what you need from them next. Ask for exactly that.</p>`],
 ["p","Writing in Marathi",`<p>AI assistants can draft in Marathi, but the result is sometimes stiff or uses the wrong word for a legal term. Standard practice is to keep terms such as notice, FIR, bail, summons and decree in English, or to give the English in brackets. Ask for this explicitly.</p>`],
 ["prompt","Try it",`Write a letter from me to my client explaining the following situation.
SITUATION: [anonymised facts and your legal view]
AUDIENCE: [CLIENT], a shopkeeper in Pune with no legal training.
STRUCTURE: What happened; What it means for you; Your options; Likely time and cost; What I need from you by [date].
Write it twice:
(a) in plain English, under 300 words;
(b) in Marathi, keeping legal terms such as notice, FIR, bail and court names in English.
Do not give any advice that is not in the situation I described.`],
 ["task","Practice task",`<p>Generate both versions for one real (anonymised) update. Ask a fluent Marathi reader to mark anything unclear or wrong.</p>`],
 ["verify","Verify before you rely",`<p>Never send translated legal advice without a fluent reader checking it. A translation error can change the advice itself.</p>`]
]},
14:{min:25,sections:[
 ["p","The brief",`<p>Build a complete notice-to-reply file for one invented or fully anonymised dispute, such as an unpaid supplier invoice or a dishonoured cheque, using what you learned this week and in Week 1.</p>`],
 ["table","What the file contains",`<div class="tbl"><table><thead><tr><th>Document</th><th>Lesson</th></tr></thead><tbody>
<tr><td>Chronology table</td><td>Day 5</td></tr>
<tr><td>Research memo from verified authorities</td><td>Day 10</td></tr>
<tr><td>Legal notice</td><td>Day 11</td></tr>
<tr><td>Reply, drafted as opposing counsel</td><td>Day 12</td></tr>
<tr><td>Opposing-counsel stress test of your notice</td><td>Day 6</td></tr>
<tr><td>Client letter, English and Marathi</td><td>Day 13</td></tr>
</tbody></table></div>`],
 ["prompt","Try it",`Here are the documents in my practice file: [paste chronology, notice, reply].
Act as a senior advocate reviewing a junior's file.
1. List every inconsistency between the documents (dates, amounts, names, facts).
2. Identify the weakest point in the notice that the reply exploits.
3. Suggest what I should change in the notice, in order of importance.
Do not rewrite the documents.`],
 ["task","Week 2 project",`<p>Complete the file and run the review prompt. In today's playbook entry, record how long the whole file took, how many corrections you made, and which prompt saved you the most time.</p>`],
 ["verify","Verify before you rely",`<p>Recalculate every limitation date and statutory deadline in the file yourself, and check every section number against India Code.</p>`]
]}
});

15:{min:15,sections:[
 ["p","Read for the deal first",`<p>Before you look for risk, understand the deal. A first read answers: who the parties are, what each must do, how money moves, how long it lasts, how it ends, and who carries the risk if something goes wrong.</p>`],
 ["table","A one-page deal map",`<div class="tbl"><table><thead><tr><th>Field</th><th>What to capture</th></tr></thead><tbody>
<tr><td>Parties and roles</td><td>Who is the vendor, customer, licensor, etc.</td></tr>
<tr><td>Subject matter</td><td>What is being supplied, licensed or done</td></tr>
<tr><td>Price and payment</td><td>Amount, schedule, taxes, late payment</td></tr>
<tr><td>Term and renewal</td><td>Start, end, automatic renewal</td></tr>
<tr><td>Exit</td><td>Termination rights and notice periods</td></tr>
<tr><td>Risk allocation</td><td>Indemnities, liability caps, insurance</td></tr>
<tr><td>Disputes</td><td>Governing law, courts, arbitration seat</td></tr>
<tr><td>Defined terms</td><td>Definitions that change the meaning of obligations</td></tr>
</tbody></table></div>`],
 ["prompt","Try it",`I am attaching an anonymised contract. Work only from this document.
Prepare a one-page deal map with these fields: Parties and roles; Subject matter; Price and payment; Term and renewal; Termination rights and notice; Indemnities and liability cap; Governing law and dispute resolution; Key defined terms.
Give the clause number for every entry. If the contract is silent on a field, write "silent". List any schedule or annexure that is referred to but not attached.`],
 ["task","Practice task",`<p>Make a deal map for a contract you have recently reviewed. Check whether it found every defined term that changes an obligation.</p>`],
 ["verify","Verify before you rely",`<p>Read the definitions clause yourself. A single definition (for example of "Confidential Information" or "Losses") can change every clause that uses it.</p>`]
]},
16:{min:15,sections:[
 ["table","Indian law hot spots in commercial contracts",`<div class="tbl"><table><thead><tr><th>Clause</th><th>Why it matters</th></tr></thead><tbody>
<tr><td>Post-termination non-compete</td><td>Void as a restraint of trade under Section 27, Indian Contract Act, 1872. See <span class="cite">Percept D'Mark (India) v. Zaheer Khan</span>, (2006) 4 SCC 227.</td></tr>
<tr><td>Liquidated damages</td><td>Section 74 allows only reasonable compensation up to the stated sum. See <span class="cite">Kailash Nath Associates v. DDA</span>, (2015) 4 SCC 136.</td></tr>
<tr><td>Shortened time to sue</td><td>Clauses that extinguish rights after a short period engage Section 28.</td></tr>
<tr><td>Arbitration seat or venue</td><td>The seat decides which court has supervisory jurisdiction. See <span class="cite">BGS SGS Soma JV v. NHPC Ltd.</span>, (2020) 4 SCC 234.</td></tr>
<tr><td>Stamp duty</td><td>An insufficiently stamped instrument is inadmissible until duty is paid. A seven-judge bench held in 2023 that this is a curable defect and does not render an arbitration agreement void.</td></tr>
<tr><td>Indemnity</td><td>Sections 124–125 of the Contract Act; check scope, caps and procedure.</td></tr>
</tbody></table></div>`],
 ["prompt","Try it",`I act for [CLIENT], the [vendor / customer] in the attached anonymised contract. Indian law governs.
Prepare a risk table: Clause no. | What it says (one line) | Risk to my client | Rating (high / medium / low) | Why | Suggested amendment.
Pay particular attention to: non-compete and non-solicit; liquidated damages; limitation of liability; indemnities; termination; arbitration seat; stamp duty.
Mark any legal proposition with [CHECK]. Do not cite cases.`],
 ["task","Practice task",`<p>Run the risk table on a contract you know. Compare its ratings with your own. Where did it rate a clause too high or too low, and why?</p>`],
 ["verify","Verify before you rely",`<p>Check each [CHECK] item against the statute and the leading cases yourself. Risk ratings are a starting point for your judgment, not a substitute for it.</p>`]
]},
17:{min:15,sections:[
 ["p","An NDA checklist",`<ul><li>Mutual or one-way, and does that match the deal?</li><li>Definition of confidential information: too wide or too narrow?</li><li>Standard exclusions: public information, already known, independently developed, received from a third party, required by law.</li><li>Permitted disclosure to employees and advisers, on a need-to-know basis.</li><li>Term, and how long obligations survive.</li><li>Return or destruction of information at the end.</li><li>Remedies, including injunctive relief.</li><li>Hidden non-compete or non-solicit terms (Section 27 risk).</li><li>Personal data shared under the NDA (DPDP Act).</li><li>Governing law and jurisdiction.</li></ul>`],
 ["prompt","Try it",`Review the attached anonymised NDA for [CLIENT], who will be the [disclosing / receiving / both] party.
Go through this checklist and, for each item, give: Clause no. | Present? (yes / no / partly) | Comment | Suggested wording.
Checklist: mutuality; definition of confidential information; standard exclusions; permitted disclosures; term and survival; return or destruction; remedies; non-compete or non-solicit terms; personal data; governing law and jurisdiction.
End with the three changes I should ask for first.`],
 ["task","Practice task",`<p>Review a standard NDA from your own files. Turn the output into a reusable NDA checklist for your practice.</p>`],
 ["verify","Verify before you rely",`<p>Read the final NDA end to end yourself. Short documents hide important words such as "perpetual", "irrevocable" and "including without limitation".</p>`]
]},
18:{min:20,sections:[
 ["p","The legal test",`<p>Under the Trade Marks Act, 1999, a mark may be refused on absolute grounds (Section 9: descriptive, generic or lacking distinctive character) or relative grounds (Section 11: identical or similar to an earlier mark, with a likelihood of confusion). Goods and services are classified in 45 Nice classes. For deceptive similarity, <span class="cite">Cadila Health Care Ltd. v. Cadila Pharmaceuticals Ltd.</span>, (2001) 5 SCC 73 sets out the factors to weigh.</p>`],
 ["p","What AI can and cannot do here",`<p>An AI assistant cannot search the Trade Marks Register. You run the search yourself on the IP India public search. The assistant helps before the search (phonetic and visual variants to search) and after it (structuring the results into a memo).</p>`],
 ["table","Clearance memo structure",`<div class="tbl"><table><thead><tr><th>Section</th><th>Content</th></tr></thead><tbody>
<tr><td>Proposed mark and goods/services</td><td>Mark, classes, description</td></tr>
<tr><td>Searches run</td><td>Where, when, search terms, classes</td></tr>
<tr><td>Inherent registrability</td><td>Section 9 analysis</td></tr>
<tr><td>Conflicting marks</td><td>Table of marks, owners, status, classes</td></tr>
<tr><td>Risk assessment</td><td>Section 11 analysis for each conflict</td></tr>
<tr><td>Common law use</td><td>Unregistered use found online, company names, domains</td></tr>
<tr><td>Recommendation</td><td>Proceed / modify / avoid, with reasons</td></tr>
</tbody></table></div>`],
 ["prompt","Try it",`STEP 1 (before searching): For the proposed mark "[MARK]" for [goods/services], list phonetic variants, spelling variants, translations into Hindi and Marathi, and the Nice classes I should search. Do not judge availability.

STEP 2 (after searching): Here are my search results from the IP India public search: [paste table of marks, owners, classes, status].
Draft a clearance memo using these headings: Proposed mark and goods; Searches run; Inherent registrability (Section 9); Conflicting marks; Risk assessment (Section 11); Recommendation.
Use only the results I pasted. Mark legal propositions with [CHECK].`],
 ["task","Practice task",`<p>Run a clearance exercise for an invented brand name in Class 25 or Class 9. Complete the search yourself and use the assistant only for steps 1 and 2.</p>`],
 ["verify","Verify before you rely",`<p>Confirm the status of every conflicting mark on the Register (registered, opposed, abandoned) and check for unregistered prior use, which can defeat registration under Section 11 and support passing off.</p>`]
]},
19:{min:15,sections:[
 ["table","Routes for taking down infringing content",`<div class="tbl"><table><thead><tr><th>Route</th><th>Key points</th></tr></thead><tbody>
<tr><td>Copyright Act notice</td><td>Section 52(1)(c) with Rule 75 of the Copyright Rules, 2013: on a written complaint from the owner, the intermediary disables access for 21 days; the owner must produce a court order within that period.</td></tr>
<tr><td>IT Rules grievance</td><td>Under the IT Rules, 2021, platforms must acknowledge a complaint within 24 hours and resolve it within 15 days.</td></tr>
<tr><td>Platform policy</td><td>Most platforms have their own copyright forms, often faster than either route above.</td></tr>
<tr><td>Court order</td><td>For actual knowledge under Section 79(3)(b) of the IT Act, see <span class="cite">Shreya Singhal v. Union of India</span>, (2015) 5 SCC 1.</td></tr>
</tbody></table></div>`],
 ["p","Before you send",`<p>Confirm ownership. The author is usually the first owner (Section 17), and an assignment must be in writing (Section 19). Consider whether the use might be fair dealing under Section 52. Check whether the real issue is a trade mark, not copyright.</p>`],
 ["prompt","Try it",`Draft a copyright infringement notice to [PLATFORM] on behalf of [CLIENT].
FACTS:
- Work: [description, date of creation or first publication]
- Ownership: [author / assignment dated __]
- Infringing copy: [URL or location, date found]
- What was copied: [description]
Include: description of the work; basis of ownership; exact location of the infringing material; a statement that the use is not authorised; a request to remove or disable access; contact details. Keep it factual. Do not threaten consequences I have not instructed. Mark legal references with [CHECK].`],
 ["task","Practice task",`<p>Draft a notice for an invented case of a copied photograph on a website. Then ask the assistant for the strongest fair-dealing argument the other side could make.</p>`],
 ["verify","Verify before you rely",`<p>Check the platform's current procedure and the current text of Rule 75 and the IT Rules. Overstating ownership in a takedown notice exposes your client to counter-claims.</p>`]
]},
20:{min:15,sections:[
 ["p","Use the right tool for each job",`<p>Finding exact changes is a job for a comparison tool, such as Compare Documents in Word. AI assistants can miss changes in long documents. Use the assistant for the second step: explaining what each change means and who it favours.</p>`],
 ["prompt","Try it",`I am attaching a redline comparison of two versions of an anonymised [type of agreement]. I act for [CLIENT], the [party].
For every change, give: Clause no. | Change (one line) | Who it favours | Risk to my client (high / medium / low) | Suggested response (accept / reject / counter-propose, with wording).
Then list any change to a defined term, and every clause affected by it.
Finally, list cross-references that may now point to the wrong clause number.`],
 ["task","Practice task",`<p>Create two versions of a short agreement and make five changes, including one hidden in a definition. Run Word's comparison, then the prompt. Did the assistant catch the definition change and its effect?</p>`],
 ["verify","Verify before you rely",`<p>Count the changes in the comparison tool and in the assistant's table. They must match. Check every cross-reference in the final version.</p>`]
]},
21:{min:25,sections:[
 ["p","The brief",`<p>Prepare a contract review note for an invented or fully anonymised commercial agreement, as you would for a client.</p>`],
 ["table","What the note contains",`<div class="tbl"><table><thead><tr><th>Part</th><th>Lesson</th></tr></thead><tbody>
<tr><td>Deal map</td><td>Day 15</td></tr>
<tr><td>Risk table</td><td>Day 16</td></tr>
<tr><td>Negotiation list, in priority order</td><td>Days 16–17</td></tr>
<tr><td>Response to the other side's redline</td><td>Day 20</td></tr>
<tr><td>Covering email to the client</td><td>Day 13</td></tr>
</tbody></table></div>`],
 ["prompt","Try it",`Using the deal map and risk table below, draft a contract review note for my client.
STRUCTURE:
1. Summary (5 lines: what the deal is and whether it is safe to sign as drafted)
2. Must-change items (high risk), with proposed wording
3. Should-change items (medium risk)
4. Points to note (low risk)
5. Questions for the client
Keep it under two pages. Use plain English.

DEAL MAP: [paste]
RISK TABLE: [paste, after your own corrections]`],
 ["task","Week 3 project",`<p>Complete the note. In today's playbook entry, record which clauses the assistant rated wrongly and the rule you will follow next time.</p>`],
 ["verify","Verify before you rely",`<p>Read the contract once more in full after finishing the note. Make sure every must-change item quotes the right clause.</p>`]
]}

22:{min:20,sections:[
 ["p","The law in brief",`<p>The Digital Personal Data Protection Act, 2023 applies to digital personal data. The DPDP Rules were notified in November 2025 and bring obligations into force in phases, so check the current commencement position before advising.</p>`],
 ["table","Core obligations of a Data Fiduciary",`<div class="tbl"><table><thead><tr><th>Obligation</th><th>Section</th></tr></thead><tbody>
<tr><td>Lawful ground: consent or a legitimate use</td><td>4, 6, 7</td></tr>
<tr><td>Notice to the Data Principal</td><td>5</td></tr>

</tbody></table></div><p>The Schedule sets penalties of up to ₹250 crore for failing to take reasonable security safeguards, and up to ₹200 crore each for failing to notify a breach and for breaching the children's data obligations.</p>`],

23:{min:15,sections:[
 ["p","What a notice must say",`<p>Under Section 5, a notice given with a request for consent must tell the Data Principal what personal data is processed and why, how to withdraw consent and exercise their rights, and how to complain to the Data Protection Board. Under Section 5(3), the Data Principal can choose to read it in English or in any language in the Eighth Schedule of the Constitution. The Rules add requirements on form, including plain language and an itemised description.</p>`],
 ["prompt","Try it",`Draft a privacy notice under the Digital Personal Data Protection Act, 2023 for [CLIENT], a [type of business].
DATA WE COLLECT AND WHY: [list each item with its purpose]
SHARED WITH: [list]
RETENTION: [period for each category]
CONTACT FOR QUERIES: [designation and email]
Requirements: plain English, short sentences, an itemised table of data and purposes, a section on how to withdraw consent, how to exercise rights, and how to complain to the Data Protection Board of India. Do not describe any practice I have not listed.
Then translate the notice into Marathi, keeping the names of the Act and the Board in English.`],
 ["task","Practice task",`<p>Draft a notice for the business you used on Day 22. Compare it against the gap table: does every gap now have an answer in the notice?</p>`],
 ["verify","Verify before you rely",`<p>A notice must describe what the business actually does. A notice that misdescribes processing is worse than no notice. Confirm each line with the client.</p>`]
]},
24:{min:20,sections:[
 ["p","Why a small firm needs one",`<p>Your juniors, clerks and interns are already using AI tools. A one-page policy protects client confidence and the firm's reputation. Courts are issuing their own directions too; the Kerala High Court, for example, issued a policy in 2025 restricting AI use in its district judiciary. Check any directions from the courts where you practise.</p>`],
 ["table","Policy headings",`<div class="tbl"><table><thead><tr><th>Heading</th><th>Decide</th></tr></thead><tbody>
<tr><td>Scope</td><td>Who it applies to: advocates, staff, interns</td></tr>
<tr><td>Approved tools</td><td>Which tools and which account settings</td></tr>
<tr><td>Prohibited data</td><td>What may never be entered</td></tr>
<tr><td>Anonymisation</td><td>Rules from your Day 2 note</td></tr>
<tr><td>Verification duty</td><td>Every citation and fact checked against primary sources</td></tr>

<tr><td>Records</td><td>What is kept, and where</td></tr>
<tr><td>Review</td><td>Who updates the policy, and how often</td></tr>
</tbody></table></div>`],
 ["prompt","Try it",`Draft a one-page AI-use policy for a small law office in India with [number] advocates and [number] staff.
Use these headings: Scope; Approved tools; Prohibited data; Anonymisation; Verification duty; Court filings; Client communication; Records; Review.
Base the confidentiality rules on my note below. Write in short, numbered rules that a new intern can follow. Do not add obligations I have not asked for.

MY CONFIDENTIALITY NOTE (from Day 2): [paste]`],
 ["task","Practice task",`<p>Draft the policy and ask one colleague or junior to read it. Note any rule they found unclear and revise it yourself.</p>`],
 ["verify","Verify before you rely",`<p>Check your approved tools' current data and privacy terms, and the current directions of the courts where you practise.</p>`]
]},
25:{min:15,sections:[
 ["p","Stop repeating yourself",`<p>Most AI assistants let you save standing instructions that apply to every conversation, and group work into projects with their own instructions and reference files. In Claude these are Projects; other assistants have similar features. Set them up once for each type of work.</p>`],
 ["prompt","Try it",`STANDING INSTRUCTIONS FOR MY LEGAL WORK
- I am an advocate practising in [state], India.
- Apply Indian law unless I say otherwise. Use the BNS, BNSS and BSA for events on or after 1 July 2024, and the IPC, CrPC and IEA for earlier events.
- Never invent case law. Cite a case only if I have provided it, and mark any legal proposition you are unsure of with [CHECK].
- All client details I share are anonymised. Do not ask for real names.
- Use Indian English spelling, DD.MM.YYYY dates, and Rs. or ₹ for amounts.
- When I ask for a draft, use numbered paragraphs and end with a list of points I must verify.`],
 ["task","Practice task",`<p>Adapt the instructions above and save them in your assistant. Create one project for a recurring type of work (for example trademark matters) and add your Day 18 memo structure as a reference file.</p>`],
 ["verify","Verify before you rely",`<p>Do not upload client files to a project unless your policy and the tool's settings allow it. Update reference files when the law changes; an outdated file will be applied silently.</p>`]
]},
26:{min:15,sections:[
 ["p","Why a library",`<p>Over this course you have written and tested more than twenty prompts. Kept in one organised place, they become a tool you can hand to a junior on their first day.</p>`],

MY PLAYBOOK: [paste from the My playbook page]`],

const T=(k,vars)=>{let s=ui()[k];if(typeof s!=="string")return s;if(vars)for(const v in vars)s=s.split("{"+v+"}").join(vars[v]);return s};
const wkT=w=>{const t=TX[LANG]&&TX[LANG].weeks&&TX[LANG].weeks[w-1];return t||WEEKS[w-1]};
const dayT=n=>{const w=Math.ceil(n/7);return wkT(w).days[(n-1)%7]||allDays[n-1].t};
const secT=(n,i,sec)=>{const t=TX[LANG]&&TX[LANG].L&&TX[LANG].L[n]&&TX[LANG].L[n][i];
  if(!t)return {h:sec[1],c:sec[2]};
  return {h:t[0]||sec[1],c:sec[0]==="prompt"?sec[2]:(t[1]||sec[2])};};

function langMenu(){
  const cur=CURATED.find(c=>c[0]===LANG)[1];
  return `<details class="langmenu" id="langmenu">
    <summary><span class="lm-ic" aria-hidden="true">अ/A</span> ${esc(cur)}<span class="sr"> · ${T("lang_label")}</span></summary>
    <div class="lm-pop">
      <div class="eyebrow">${T("lang_full")}</div>
      <div class="lm-cur">${CURATED.map(([c,l])=>`<button type="button" class="lm-btn" data-lang="${c}" lang="${c}" aria-pressed="${c===LANG}">${l}</button>`).join("")}</div>
      <div class="eyebrow" style="margin-top:14px">${T("lang_mt")}</div>
      <p class="lm-note">${T("lang_mt_note")}</p>
      <ul class="lm-mt">${MACHINE.map(([c,n,e])=>`<li><a href="${mtURL(c)}" target="_blank" rel="noopener" lang="${c}">${n}<span>${e}</span></a></li>`).join("")}</ul>
    </div></details>`;
}

function chrome(){
  document.documentElement.lang=LANG==="en"?"en-IN":LANG;
  $("#nav").innerHTML=`<a href="#curriculum">${T("nav_curr")}</a><a href="#day-1">${T("nav_start")}</a><a href="#playbook">${T("nav_pb")}</a><a href="#instructor">${T("nav_instr")}</a>`;
  $("#langbox").innerHTML=langMenu();
  $("#foot").innerHTML=T("foot").map(p=>`<p>${p}</p>`).join("");
  document.querySelectorAll(".lm-btn").forEach(b=>b.addEventListener("click",()=>{
    LANG=b.dataset.lang;store.set("ailp-lang",LANG);chrome();route(true);}));
}
const notice=()=>LANG==="en"?"":`<div class="trnote" role="note">${T("tr_notice")}</div>`;

function home(){
  const count=Object.keys(done).length;
  const next=count?((allDays.find(d=>!done[d.n])||{n:28}).n):1;
  const D=T("diff");
  return `${notice()}
<div class="hero">
  <div>
    <div class="eyebrow">${T("hero_eyebrow")}</div>
    <h1 style="margin-top:14px">${T("hero_h1")}</h1>
    <p class="lede">${T("hero_lede")}</p>
    <div class="cta"><a class="btn primary" href="#day-${next}">${count?T("btn_continue"):T("btn_start")}</a><a class="btn" href="#curriculum">${T("btn_curr")}</a></div>
  </div>
  <div class="stamp" aria-label="${T("fee")}">
    <div class="eyebrow" style="color:var(--seal)">${T("fee")}</div>
    <div class="big">₹ 0</div>
    <dl>
      <dt>28</dt><dd>${T("st1")}</dd>
      <dt>15</dt><dd>${T("st2")}</dd>
      <dt>4</dt><dd>${T("st3")}</dd>
      <dt>0</dt><dd>${T("st4")}</dd>
    </dl>
  </div>
</div>

<section aria-labelledby="h-diff">
  <div class="sec-head"><div class="eyebrow">${T("diff_eb")}</div><h2 id="h-diff">${T("diff_h")}</h2></div>
  <div class="diff">${D.map(([h,p])=>`<div><h3>${h}</h3><p>${p}</p></div>`).join("")}</div>
</section>

<section id="curriculum" aria-labelledby="h-cur">
  <div class="sec-head"><div class="eyebrow">${T("cur_eb",{n:count})}</div><h2 id="h-cur">${T("cur_h")}</h2></div>
  <div class="weeks">${WEEKS.map(w=>{const tw=wkT(w.w);return `
    <div class="week">
      <div><div class="eyebrow">${T("week")} ${w.w}</div><h3>${tw.title}</h3><p class="wdesc">${tw.desc}</p></div>
      <ol class="days">${w.days.map((t,i)=>{const n=(w.w-1)*7+i+1;
        const tag=done[n]?`<span class="tag done">${T("tag_done")}</span>`:`<span class="tag open">${T("tag_open")}</span>`;
        return `<li><a href="#day-${n}"><span class="n">${T("day")} ${String(n).padStart(2,"0")}</span><span class="t">${esc(dayT(n))}</span>${tag}</a></li>`}).join("")}</ol>
    </div>`}).join("")}
  </div>
</section>

<section id="instructor" aria-labelledby="h-ins">
  <div class="instr">
    <div class="eyebrow">${T("instr_eb")}</div>
    <div>
      <h2 id="h-ins" style="font-size:clamp(28px,4vw,40px);font-weight:750;margin-bottom:14px">Kundan Mane</h2>
      <p>${T("instr_bio")}</p>
      <ul class="creds">${T("creds").map(c=>`<li>${c}</li>`).join("")}</ul>
      <p style="margin-top:16px"><a href="https://www.linkedin.com/in/kundan-k-m-221178256" target="_blank" rel="noopener">${T("follow")}</a></p>
    </div>
  </div>
</section>`;
}

function lessonNav(cur){
  const wk=Math.ceil(cur/7), base=(wk-1)*7;
  return `<aside aria-label="${T("week")} ${wk}"><div class="eyebrow">${T("week")} ${wk}</div><ol>${WEEKS[wk-1].days.map((t,i)=>{const n=base+i+1;
    return `<li><a href="#day-${n}"${n===cur?' aria-current="page"':''}>${done[n]?'<span class="ck">✓</span> ':''}${T("day")} ${n}</a></li>`}).join("")}</ol>
    <p style="margin-top:16px"><a href="#curriculum" style="color:var(--muted)">${T("all28")}</a></p></aside>`;
}

function entryBlock(n){
  const v=notes[n]||{};const F=T("fields");const keys=["task","ai","prompt"];
  return `<div class="entry" aria-labelledby="eh-${n}">
    <h2 id="eh-${n}">${T("entry_h",{n})}</h2>
    <p>${T("entry_p")}</p>
    ${keys.map((k,i)=>`<label for="nt-${n}-${k}">${F[i]}</label><textarea id="nt-${n}-${k}" data-k="${k}">${esc(v[k]||"")}</textarea>`).join("")}
    <div class="saved" id="saved-${n}" aria-live="polite"></div>
  </div>`;
}

function lesson(n){
  const d=allDays[n-1]; const data=L[n];
  const prev=n>1?`<a class="btn" href="#day-${n-1}">← ${T("day")} ${n-1}</a>`:`<a class="btn" href="#home">← ${T("home")}</a>`;
  const next=n<28?`<a class="btn primary" href="#day-${n+1}">${T("day")} ${n+1} →</a>`:"";
  let k=0;
  const body=data.sections.map((sec,i)=>{k++;const {h,c}=secT(n,i,sec);const type=sec[0];
    if(type==="prompt"){const note=T("prompt_note");
      return `<div class="para" data-n="¶${k}"><h2>${h}</h2>${note?`<p class="pnote">${note}</p>`:""}<div class="prompt" lang="en"><header><span>${T("prompt_lbl")}</span><button class="copy" type="button" data-k="${k}">${T("copy")}</button></header><pre id="pr-${n}-${k}">${esc(c)}</pre></div></div>`;}
    const cls=type==="verify"?"verify":type==="task"?"task":"";
    return `<div class="para ${cls}" data-n="¶${k}"><h2>${h}</h2>${c}</div>`;
  }).join("");
  return `${notice()}<div class="lesson">${lessonNav(n)}<article class="sheet">
    <div class="eyebrow">${T("wk_day",{w:d.w,n})}</div>
    <h1>${esc(dayT(n))}</h1>
    <div class="meta"><span>${data.min} ${T("min")}</span><span>${T("free")}</span><span>${T("works")}</span></div>
    ${body}
    ${entryBlock(n)}
    <div class="lnav">${prev}<button class="btn donebtn" type="button" id="done-btn" aria-pressed="${!!done[n]}">${done[n]?T("completed"):T("mark")}</button>${next}</div>
  </article></div>`;
}

function playbookText(){
  const F=T("fields"),keys=["task","ai","prompt"];
  let out=T("pb_title")+"\nAI in Legal Practice · An AI lawyer's insights\n\n";
  allDays.forEach(d=>{const v=notes[d.n]||{};
    out+=`${T("day").toUpperCase()} ${d.n}: ${dayT(d.n)}${done[d.n]?"  "+T("pb_done"):""}\n`;
    keys.forEach((k,i)=>{out+=`  ${F[i]}: ${(v[k]||"—").trim()}\n`});out+="\n";});
  return out;
}

function playbook(){
  const F=T("fields"),keys=["task","ai","prompt"];
  const filled=allDays.filter(d=>notes[d.n]&&keys.some(k=>(notes[d.n][k]||"").trim())).length;
  const pct=Math.round(filled/28*100);
  return `${notice()}<div class="pb">
    <div class="eyebrow">${T("pb_eb")}</div>
    <h1>${T("pb_h")}</h1>
    <p>${T("pb_p")}</p>
    <div class="meter" role="progressbar" aria-valuenow="${filled}" aria-valuemin="0" aria-valuemax="28" aria-label="${T("pb_h")}"><span style="width:${pct}%"></span></div>
    <div class="eyebrow">${T("pb_count",{n:filled})}</div>
    <div class="cta"><button class="btn primary" type="button" id="pb-copy">${T("pb_copy")}</button>${framed?"":`<button class="btn" type="button" id="pb-dl">${T("pb_dl")}</button>`}</div>
    <p class="fine" style="margin-top:10px">${T("pb_note")}</p>
    <textarea id="pb-text" aria-hidden="true" tabindex="-1" readonly></textarea>
    <div style="margin-top:24px">${allDays.map(d=>{const v=notes[d.n]||{};
      return `<div class="pbday"><h2><a href="#day-${d.n}">${T("day")} ${d.n}</a> · ${esc(dayT(d.n))}</h2><dl>${keys.map((k,i)=>`<dt>${F[i]}</dt><dd>${(v[k]||"").trim()?esc(v[k]):`<span class="empty">${T("not_yet")}</span>`}</dd>`).join("")}</dl></div>`}).join("")}</div>
  </div>`;
}

function copyText(btn,getText,fallbackEl,label){
  const txt=getText();
  const ok=()=>{btn.textContent=T("copied");setTimeout(()=>btn.textContent=label,1600)};
  const fb=()=>{fallbackEl();btn.textContent=T("selected")};
  try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}
}

function route(keepScroll){
  const h=location.hash.slice(1);
  const m=/^day-(\d{1,2})$/.exec(h);
  const v=$("#view");
  if(m&&+m[1]>=1&&+m[1]<=28){
    const n=+m[1]; v.innerHTML=lesson(n); if(!keepScroll)window.scrollTo(0,0);
    v.querySelectorAll(".copy").forEach(b=>b.addEventListener("click",()=>{
      const pre=document.getElementById(`pr-${n}-${b.dataset.k}`);
      copyText(b,()=>pre.textContent,()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r)},T("copy"));
    }));
    const db=$("#done-btn");
    if(db) db.addEventListener("click",()=>{if(done[n])delete done[n];else done[n]=1;save();
      db.setAttribute("aria-pressed",!!done[n]);db.textContent=done[n]?T("completed"):T("mark");
      const a=v.querySelector(`aside a[href="#day-${n}"]`);if(a)a.innerHTML=(done[n]?'<span class="ck">✓</span> ':'')+T("day")+" "+n;});
    let tmr;
    v.querySelectorAll(".entry textarea").forEach(t=>t.addEventListener("input",()=>{
      notes[n]=notes[n]||{};notes[n][t.dataset.k]=t.value;
      clearTimeout(tmr);tmr=setTimeout(()=>{const ok=saveNotes();const s=$("#saved-"+n);
        if(s)s.textContent=ok?T("saved"):T("save_err");},400);
    }));
  }else if(h==="playbook"){
    v.innerHTML=playbook();if(!keepScroll)window.scrollTo(0,0);
    const cb=$("#pb-copy"),ta=$("#pb-text");
    cb.addEventListener("click",()=>copyText(cb,playbookText,()=>{ta.value=playbookText();ta.style.cssText="position:static;width:100%;height:220px;margin-top:12px";ta.removeAttribute("aria-hidden");ta.focus();ta.select()},T("pb_copy")));
    const dl=$("#pb-dl"); if(dl) dl.addEventListener("click",()=>{
      try{const blob=new Blob([playbookText()],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");
        a.href=URL.createObjectURL(blob);a.download="my-ai-practice-playbook.txt";document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href),2000);}catch(e){}});
  }else{
    v.innerHTML=home();
    if(keepScroll)return;
    if(h==="curriculum"||h==="instructor"){const t=document.getElementById(h);if(t)t.scrollIntoView();}else window.scrollTo(0,0);
  }
}
addEventListener("hashchange",()=>{const d=$("#langmenu");if(d)d.open=false;route()});
document.addEventListener("click",e=>{const d=$("#langmenu");if(d&&d.open&&!d.contains(e.target))d.open=false});
chrome();
route();

</script>

</body>
</html>
